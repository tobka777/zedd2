name: Beta Build (Develop)

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [labeled, synchronize]

jobs:
  build-beta:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'beta-build')

    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.3.0
          architecture: "x64"

      - name: install workspace dependencies
        run: npm install

      - name: build platform
        run: npm run build --workspace=zedd-platform

      - name: build beta release
        run: npm run make --workspace=zedd-app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: upload beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beta-build-${{ matrix.os }}
          path: |
            ./zedd-app/out/**/*.snap
            ./zedd-app/out/**/*.dmg
            ./zedd-app/out/**/*.zip
            ./zedd-app/out/make/squirrel.windows/x64/*.exe
            ./zedd-app/out/make/squirrel.windows/x64/*.nupkg
            ./zedd-app/out/make/squirrel.windows/x64/RELEASES
