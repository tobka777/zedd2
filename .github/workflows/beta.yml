name: Beta Build (Develop)

on:
  push:
    branches:
      - develop
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
    types: [labeled, synchronize]

jobs:
  build-beta:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'beta-build')

    strategy:
      fail-fast: false
      matrix:
        include:
        -  os: windows-latest
           arch: x64
        -  os: macos-latest
           arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 25.3.0
          architecture: ${{ matrix.arch }}

      - name: install platform dependencies
        working-directory: ./zedd-platform
        run: npm install --workspaces=false
      - name: build platform
        working-directory: ./zedd-platform
        run: npm run build
      - name: build beta release 
        working-directory: ./zedd-app
        run: npm install --workspaces=false
      - name: package app
        working-directory: ./zedd-app
        run: npm run package -- --arch=${{ matrix.arch }}

      - name: ad-hoc sign macOS app
        if: runner.os == 'macOS'
        working-directory: ./zedd-app
        run: |
          app="out/zedd-app-darwin-${{ matrix.arch }}/zedd-app.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: build beta release
        working-directory: ./zedd-app
        run: npm run make -- --arch=${{ matrix.arch }} --skip-package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: upload beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beta-build-${{ matrix.os }}-${{matrix.arch}}
          path: |
            ./zedd-app/out/**/*.snap
            ./zedd-app/out/**/*.dmg
            ./zedd-app/out/**/*.zip
            ./zedd-app/out/make/squirrel.windows/x64/*.exe
            ./zedd-app/out/make/squirrel.windows/x64/*.nupkg
            ./zedd-app/out/make/squirrel.windows/x64/RELEASES
